# Where Grafana reads data from: Prometheus for metrics, Tempo for traces. Both are reached by
# their compose service names on the internal network, not through localhost.
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
