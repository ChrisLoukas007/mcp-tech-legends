# Provisioning = Grafana configures itself from files at startup, no clicking in the UI.
# This file says: load every dashboard JSON found in /var/lib/grafana/dashboards
# (mounted from infra/grafana/dashboards/) into the "Tech Legends" folder.
apiVersion: 1
providers:
  - name: tech-legends
    folder: Tech Legends
    type: file
    options:
      path: /var/lib/grafana/dashboards
