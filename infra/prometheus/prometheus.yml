# Prometheus pulls ("scrapes") /metrics from every MCP server every 15 seconds.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: mcp-servers
    metrics_path: /metrics
    static_configs:
      - targets: ["figures-db-mcp:8101", "hall-of-fame-mcp:8102", "wiki-mcp:8103"]
