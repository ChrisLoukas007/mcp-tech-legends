# The whole stack. Services are named by what they ARE in an MCP system.
#
#   make up       (= docker compose -f infra/docker-compose.yml --env-file .env up -d --wait)
#
# infra/ is everything the code runs ON, not the code itself. Read it in this order:
#   1. docker-compose.yml          (this file) which services run, and how they connect
#   2. postgres/01_schema.sql      the tables: three schemas, one per data owner
#   3. postgres/02_roles.sql       who may touch which schema (least privilege)
#   4. postgres/generate_seed.py   how the demo data in 03_seed.sql is produced
#   5. keycloak/realm.json         users, roles, clients and scope -> audience (JSON: no comments;
#                                  see docs/04-security.md)
#   6. prometheus/, tempo/, grafana/  collect metrics and traces, then show them
#
# Host ports avoid the defaults (5432, 8080, 3000, 9090) so this stack can run next to others.
# Every port binds to 127.0.0.1 only.

name: tech-legends

# Shared settings, reused below with YAML anchors (&name) and merges (<<: *name).
x-python-service: &python-service
  build: { context: .., dockerfile: Dockerfile }
  image: tech-legends:local
  read_only: true
  tmpfs: ["/tmp"]
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    keycloak: { condition: service_healthy }

x-healthcheck: &healthcheck
  interval: 10s
  timeout: 3s
  retries: 10

# Tokens carry iss=http://localhost:8180/realms/legends (the default issuer_url everywhere);
# the signing keys (JWKS) are fetched over the internal network.
x-values:
  jwks: &jwks http://keycloak:8080/realms/legends/protocol/openid-connect/certs
  audit-db: &audit-db postgresql://audit_writer:${AUDIT_WRITER_PASSWORD}@postgres:5432/legends
  otlp: &otlp http://tempo:4318

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: legends
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      FIGURES_READER_PASSWORD: ${FIGURES_READER_PASSWORD:?set in .env}
      HALLOFFAME_APP_PASSWORD: ${HALLOFFAME_APP_PASSWORD:?set in .env}
      AUDIT_WRITER_PASSWORD: ${AUDIT_WRITER_PASSWORD:?set in .env}
    # Files in docker-entrypoint-initdb.d run once, in name order, only when the data volume is
    # empty. After a schema change: `docker compose down -v` (deletes the data) and up again.
    volumes:
      - ./postgres/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./postgres/02_roles.sql:/docker-entrypoint-initdb.d/02_roles.sql:ro
      - ./postgres/03_seed.sql:/docker-entrypoint-initdb.d/03_seed.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports: ["127.0.0.1:5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d legends"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set in .env}
      # Fixed public URL: tokens carry iss=http://localhost:8180/realms/legends whether they were
      # requested from your machine or from inside the compose network.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    ports: ["127.0.0.1:8180:8080"]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30

  # --- the private app ------------------------------------------------------------------

  hall-of-fame-api:
    <<: *python-service
    command: ["hall-of-fame-api"]
    environment:
      HALL_OF_FAME_API_HOST: 0.0.0.0
      HALL_OF_FAME_API_DATABASE_URL: postgresql://halloffame_app:${HALLOFFAME_APP_PASSWORD}@postgres:5432/legends
      HALL_OF_FAME_API_JWKS_URL: http://keycloak:8080/realms/legends/protocol/openid-connect/certs
    ports: ["127.0.0.1:8200:8200"]
    healthcheck: { <<: *healthcheck, test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8200/healthz', timeout=2)"] }

  # --- the three MCP servers (Streamable HTTP + OAuth) ------------------------------------

  figures-db-mcp:
    <<: *python-service
    command: ["figures-db-mcp"]
    environment:
      FIGURES_DB_MCP_TRANSPORT: http
      FIGURES_DB_MCP_HOST: 0.0.0.0
      FIGURES_DB_MCP_JWKS_URL: *jwks
      FIGURES_DB_MCP_ALLOWED_HOSTS: '["localhost:*", "127.0.0.1:*", "figures-db-mcp:*"]'
      FIGURES_DB_MCP_AUDIT_DATABASE_URL: *audit-db
      FIGURES_DB_MCP_OTLP_ENDPOINT: *otlp
      FIGURES_DB_MCP_DATABASE_URL: postgresql://figures_reader:${FIGURES_READER_PASSWORD}@postgres:5432/legends
    ports: ["127.0.0.1:8101:8101"]
    healthcheck: { <<: *healthcheck, test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8101/healthz', timeout=2)"] }

  hall-of-fame-mcp:
    <<: *python-service
    command: ["hall-of-fame-mcp"]
    environment:
      HALL_OF_FAME_MCP_TRANSPORT: http
      HALL_OF_FAME_MCP_HOST: 0.0.0.0
      HALL_OF_FAME_MCP_JWKS_URL: *jwks
      HALL_OF_FAME_MCP_ALLOWED_HOSTS: '["localhost:*", "127.0.0.1:*", "hall-of-fame-mcp:*"]'
      HALL_OF_FAME_MCP_AUDIT_DATABASE_URL: *audit-db
      HALL_OF_FAME_MCP_OTLP_ENDPOINT: *otlp
      HALL_OF_FAME_MCP_API_URL: http://hall-of-fame-api:8200
      HALL_OF_FAME_MCP_TOKEN_URL: http://keycloak:8080/realms/legends/protocol/openid-connect/token
      HALL_OF_FAME_MCP_CLIENT_SECRET: ${HALL_OF_FAME_MCP_CLIENT_SECRET}
    ports: ["127.0.0.1:8102:8102"]
    healthcheck: { <<: *healthcheck, test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8102/healthz', timeout=2)"] }

  wiki-mcp:
    <<: *python-service
    command: ["wiki-mcp"]
    environment:
      WIKI_MCP_TRANSPORT: http
      WIKI_MCP_HOST: 0.0.0.0
      WIKI_MCP_JWKS_URL: *jwks
      WIKI_MCP_ALLOWED_HOSTS: '["localhost:*", "127.0.0.1:*", "wiki-mcp:*"]'
      WIKI_MCP_AUDIT_DATABASE_URL: *audit-db
      WIKI_MCP_OTLP_ENDPOINT: *otlp
    ports: ["127.0.0.1:8103:8103"]
    healthcheck: { <<: *healthcheck, test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8103/healthz', timeout=2)"] }

  # --- observability -------------------------------------------------------------------

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./tempo/tempo.yml:/etc/tempo.yml:ro
      - tempodata:/var/tempo
    ports: ["127.0.0.1:3200:3200", "127.0.0.1:4318:4318"]

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    ports: ["127.0.0.1:9091:9090"]

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3001:3000"]
    depends_on: [prometheus, tempo]

volumes:
  pgdata:
  tempodata:
