[project]
name = "mcp-tech-legends"
version = "0.1.0"
description = "Teaching repo: three MCP servers, two MCP hosts, one shared kit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp-kit",
    "figures-db-mcp",
    "wiki-mcp",
    "hall-of-fame-api",
    "hall-of-fame-mcp",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "servers/*", "apps/*", "hosts/*"]

[tool.uv.sources]
mcp-kit = { workspace = true }
figures-db-mcp = { workspace = true }
wiki-mcp = { workspace = true }
hall-of-fame-api = { workspace = true }
hall-of-fame-mcp = { workspace = true }

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "--import-mode=importlib"
testpaths = ["packages", "servers", "apps", "hosts"]
markers = [
    "integration: needs the docker compose stack (make up)",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["mcp_kit", "figures_db_mcp", "wiki_mcp", "hall_of_fame_mcp", "hall_of_fame_api", "agent_cli"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106"]
"packages/mcp-kit/src/mcp_kit/testing.py" = ["S106"]
# Offline generator: builds SQL text from constants in the same file, values escaped by sql().
"infra/postgres/generate_seed.py" = ["S311", "S608"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["packages", "servers", "apps"]
exclude = ["/tests/"]
