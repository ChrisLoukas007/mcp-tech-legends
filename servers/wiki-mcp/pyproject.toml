[project]
name = "wiki-mcp"
version = "0.1.0"
description = "MCP server over the public Wikipedia and Wikidata APIs"
requires-python = ">=3.12"
dependencies = ["mcp-kit", "httpx2>=2.16.0"]

[project.scripts]
wiki-mcp = "wiki_mcp.__main__:main"

[tool.uv.sources]
mcp-kit = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
