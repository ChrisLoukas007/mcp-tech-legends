[project]
name = "hall-of-fame-mcp"
version = "0.1.0"
description = "MCP server that wraps the private hall-of-fame-api"
requires-python = ">=3.12"
dependencies = ["mcp-kit", "httpx2>=2.16.0"]

[project.scripts]
hall-of-fame-mcp = "hall_of_fame_mcp.__main__:main"

[tool.uv.sources]
mcp-kit = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
