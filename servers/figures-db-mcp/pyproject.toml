[project]
name = "figures-db-mcp"
version = "0.1.0"
description = "MCP server over the legends Postgres database (read-only)"
requires-python = ">=3.12"
dependencies = ["mcp-kit", "asyncpg>=0.32.0"]

[project.scripts]
figures-db-mcp = "figures_db_mcp.__main__:main"

[tool.uv.sources]
mcp-kit = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
