[project]
name = "mcp-kit"
version = "0.1.0"
description = "What every server in this repo shares: auth, policy, audit, logging, metrics, tracing"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3.0,<3",
    "pydantic-settings>=2.16.2",
    "pyjwt[crypto]>=2.15.1",
    "prometheus-client>=0.26.0",
    "asyncpg>=0.32.0",
    "opentelemetry-sdk>=1.45.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
